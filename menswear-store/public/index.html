<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA MEN</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand" onclick="go('shop')">NOVA <b>MEN</b><small>MODERN MENSWEAR</small></div><nav><button onclick="go('shop')">Shop</button><button onclick="go('cart')">Bag <span id="cartCount">0</span></button><button class="adminBtn" onclick="loginAdmin()">Admin</button></nav></header>
<main>
<section id="shop" class="page"><div class="hero"><div><span class="eyebrow">NEW SEASON / 2026</span><h1>Sharp essentials.<br>Made for every day.</h1><p>Premium shirts and trousers with effortless Indian styling.</p><button class="primary" onclick="document.querySelector('#catalog').scrollIntoView()">SHOP COLLECTION</button></div><div class="heroArt">N<span>°</span>26</div></div><div id="catalog"><div class="sectionHead"><div><span class="eyebrow">THE EDIT</span><h2>Shop menswear</h2></div><div><button onclick="filter='All';loadProducts()">All</button><button onclick="filter='Shirts';loadProducts()">Shirts</button><button onclick="filter='Trousers';loadProducts()">Trousers</button></div></div><div id="products" class="grid"></div></div></section>
<section id="cart" class="page hidden"><div class="title"><span class="eyebrow">YOUR SELECTION</span><h1>Shopping bag</h1></div><div id="cartBody"></div></section>
<section id="admin" class="page hidden"><div class="adminTop"><div><span class="eyebrow">STORE CONTROL</span><h1>Admin dashboard</h1></div><button onclick="go('shop')">View Store ↗</button></div><div id="stats" class="stats"></div><div class="tabs"><button onclick="adminTab('inventory')">Inventory</button><button onclick="adminTab('billing')">POS Billing</button><button onclick="adminTab('orders')">Invoices</button></div><div id="adminBody"></div></section>
</main><footer>NOVA MEN · DEMO COMMERCE SYSTEM · INDIA</footer><script src="/app.js"></script></body></html>
